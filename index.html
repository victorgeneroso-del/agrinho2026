<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exemplo Interativo</title>
    <style>
        #texto {
            color: green;
            font-size: 24px;
            font-family: sans-serif;
        }
    </style>
</head>
<body>

    <h1 id="texto">Texto Inicial (Verde)</h1>
    <button onclick="mudarCor()">Mudar Cor</button>

    <script>
        function mudarCor() {
            document.getElementById("texto").style.color = "orange";
            document.getElementById("texto").innerText = "Texto Alterado (Laranja)!";
        }
    </script>

</body>
</html>
